services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: nap, POSTGRES_PASSWORD: nap, POSTGRES_DB: naplatform}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nap -d naplatform"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
  neo4j:
    image: neo4j:5-community
    environment: {NEO4J_AUTH: neo4j/naplatform-password}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
  hdfs-namenode:
    image: apache/hadoop:3.4.1
    hostname: hdfs-namenode
    user: root
    command: ["bash", "/bootstrap/bootstrap-namenode.sh"]
    ports: ["9870:9870", "9000:9000"]
    volumes:
      - hdfs-namenode:/tmp/hadoop-root/dfs/name
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./infra/hadoop/bootstrap-namenode.sh:/bootstrap/bootstrap-namenode.sh:ro
  hdfs-datanode-1: &dn
    image: apache/hadoop:3.4.1
    user: root
    command: ["hdfs", "datanode"]
    depends_on: [hdfs-namenode]
    volumes:
      - hdfs-datanode-1:/tmp/hadoop-root/dfs/data
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  hdfs-datanode-2:
    <<: *dn
    volumes:
      - hdfs-datanode-2:/tmp/hadoop-root/dfs/data
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  hdfs-datanode-3:
    <<: *dn
    volumes:
      - hdfs-datanode-3:/tmp/hadoop-root/dfs/data
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
  hdfs-init:
    image: apache/hadoop:3.4.1
    command: ["bash", "/bootstrap/init-hdfs.sh"]
    depends_on: [hdfs-namenode]
    volumes:
      - ./infra/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./infra/hadoop/init-hdfs.sh:/bootstrap/init-hdfs.sh:ro
  api:
    build: {context: ./services/api}
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://nap:nap@postgres:5432/naplatform
      REDIS_URL: redis://redis:6379/0
      ADMIN_PASSWORD: ChangeMe123!
      # Phase 06/07 department agent routing. Default is a deterministic dry run.
      # The hermes-* agents now serve HTTP (/health, /chat, /invoke), so this can
      # be flipped to "true" to route real HTTP calls to them:
      #   AGENT_ROUTING_ENABLED: "true"
      AGENT_ROUTING_ENABLED: "false"
      AGENT_REQUEST_TIMEOUT_SECONDS: "30"
      AGENT_INVOKE_PATH: /chat
      HERMES_ER_URL: http://hermes-er:8080
      HERMES_IT_URL: http://hermes-it:8080
      HERMES_EHS_URL: http://hermes-ehs:8080
      HERMES_QC_URL: http://hermes-qc:8080
      # Phase 10 backend selection. Default is the in-memory (dry-run) scaffold, so
      # the default stack needs no live Qdrant/Neo4j/HDFS. Flip to the real drivers
      # by setting the backend + its connection envs (qdrant/neo4j services already
      # run in this Compose file):
      #   VECTOR_BACKEND: "qdrant"   with QDRANT_URL (and optional QDRANT_API_KEY)
      #   GRAPH_BACKEND:  "neo4j"    with NEO4J_URI/NEO4J_USER/NEO4J_PASSWORD
      #   HDFS_PROVISIONING_ENABLED: "true"  to execute HDFS provisioning/readiness
      VECTOR_BACKEND: "memory"
      GRAPH_BACKEND: "memory"
      HDFS_PROVISIONING_ENABLED: "false"
      QDRANT_URL: http://qdrant:6333
      QDRANT_VECTOR_SIZE: "768"
      QDRANT_DISTANCE: Cosine
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: naplatform-password
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
      neo4j: {condition: service_started}
  # Phase 14/15: one-shot core-webui first-run preseed. This runs BEFORE `ui` starts
  # (ui depends_on it with condition: service_completed_successfully) and shares
  # the `ui-hermes-home` volume, so it can drop the repo-controlled branding /
  # settings / setup-completed markers into the core-webui state dir. Result:
  # http://localhost:3000 SKIPS the first-run setup screen but then REQUIRES LOGIN
  # (Phase 15: / redirects to /login; it does not land directly in chat). It is
  # NON-INVASIVE — it never edits the external core-webui image or its entrypoint,
  # only seeds the shared volume it reads. Env still overrides (BRAND_NAME /
  # BRAND_LOGO / NAPLATFORM_API_BASE_URL / CORE_WEBUI_LOGIN_REQUIRED win over the
  # config files). NO password is ever seeded here.
  ui-preseed:
    image: busybox:1.36
    restart: "no"
    # Use a shell-relative source path instead of `sh /preseed/preseed.sh` so
    # Windows Git Bash/MSYS does not rewrite the container path before Docker sees
    # it. Strip CRLF at runtime because Windows checkouts may mount preseed.sh
    # with CRLF, which BusyBox `sh` interprets as an illegal `set -eu` option.
    command: ["sh", "-c", "cd /preseed && tr -d '\r' < preseed.sh > /tmp/preseed.sh && sh /tmp/preseed.sh"]
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      BRAND_NAME: HMGMA
      BRAND_LOGO: /apptoo/branding/logo.jpg
      NAPLATFORM_API_BASE_URL: http://api:8080
      # Phase 15: the preseed's webui-settings.json requires login after the setup
      # skip (login_required/require_auth/start_page=login). This env lets the repo/
      # compose flip that gate at boot without editing the JSON. NO password here —
      # the login password is on the `ui` service via HERMES_WEBUI_PASSWORD.
      CORE_WEBUI_LOGIN_REQUIRED: "true"
      # Repo config is the source of truth; re-seed non-secret config each boot.
      # Set CORE_WEBUI_PRESEED_FORCE=false to preserve an existing settings.json,
      # or CORE_WEBUI_PRESEED_ENABLED=false to skip the preseed entirely.
      CORE_WEBUI_PRESEED_ENABLED: "true"
      CORE_WEBUI_PRESEED_FORCE: "true"
    volumes:
      - ui-hermes-home:/home/hermeswebui/.hermes
      - ./config/core-webui:/preseed/src:ro
      - ./config/core-webui/preseed.sh:/preseed/preseed.sh:ro
  ui:
    # Runtime UI is the sibling JacobYim/core-webui checkout. Set
    # CORE_WEBUI_CONTEXT to another local checkout/path if needed.
    build:
      context: ${CORE_WEBUI_CONTEXT:-../core-webui}
    environment:
      BRAND_NAME: HMGMA
      BRAND_LOGO: /apptoo/branding/logo.jpg
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: 8787
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      NAPLATFORM_API_BASE_URL: http://api:8080
      # Phase 14: first-run setup suppression. The ui-preseed service writes the
      # repo config + setup-completed markers into the shared state dir before
      # this service starts; these env flags are a belt-and-suspenders signal for
      # core-webui versions that read the flag from the environment instead. All
      # are overridable at run time.
      HERMES_WEBUI_SETUP_COMPLETED: "true"
      HERMES_WEBUI_DISABLE_FIRST_RUN: "true"
      HERMES_WEBUI_SKIP_ONBOARDING: "true"
      # Phase 15: after the setup screen is skipped the UI must REQUIRE LOGIN — it
      # must not land directly in chat. These flags make / redirect to /login for
      # core-webui versions that read the gate from the environment (the preseeded
      # settings.json declares the same login_required/require_auth/start_page=login).
      HERMES_WEBUI_LOGIN_REQUIRED: "true"
      HERMES_WEBUI_REQUIRE_AUTH: "true"
      HERMES_WEBUI_START_PAGE: "login"
      # Phase 16: use NAPlatform API auth as the WebUI gate. The login page is
      # email + password, registration creates a pending API account, and only an
      # admin-approved active user receives the local WebUI cookie and reaches chat.
      HERMES_WEBUI_AUTH_MODE: naplatform
      # WebUI chat needs the real Hermes Agent source on sys.path so it can import
      # run_agent.AIAgent. On this Windows dev host the default points at the
      # Hermes install under $HOME/AppData/Local/hermes/hermes-agent; override
      # HERMES_AGENT_DIR if your Hermes source lives elsewhere.
      HERMES_WEBUI_AGENT_DIR: /home/hermeswebui/.hermes/hermes-agent
    ports:
      # Default UI URL is http://localhost:3000. If port 3000 is already in use,
      # run with UI_HOST_PORT=3001 and open http://localhost:3001 instead.
      - "${UI_HOST_PORT:-3000}:8787"
    volumes:
      - ui-hermes-home:/home/hermeswebui/.hermes
      - ${HERMES_AGENT_DIR:-C:/Users/jyim67/AppData/Local/hermes/hermes-agent}:/home/hermeswebui/.hermes/hermes-agent:ro
      - ui-workspace:/workspace
    depends_on:
      api:
        condition: service_healthy
      ui-preseed:
        condition: service_completed_successfully
  hermes-er: &agent
    build: {context: ./services/hermes-agent}
    environment: {DEPARTMENT: ER, HERMES_PROFILE: ER, API_BASE_URL: 'http://api:8080', HDFS_NAMENODE: 'hdfs://hdfs-namenode:9000'}
    # Phase 07: agents serve HTTP internally only (no host port); the API reaches
    # them by service name. Set HERMES_AGENT_EXECUTION_ENABLED=true to drive the
    # real Hermes CLI (disabled by default — deterministic response).
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: [api, hdfs-namenode]
  hermes-it:
    <<: *agent
    environment: {DEPARTMENT: IT, HERMES_PROFILE: IT, API_BASE_URL: 'http://api:8080', HDFS_NAMENODE: 'hdfs://hdfs-namenode:9000'}
  hermes-ehs:
    <<: *agent
    environment: {DEPARTMENT: EHS, HERMES_PROFILE: EHS, API_BASE_URL: 'http://api:8080', HDFS_NAMENODE: 'hdfs://hdfs-namenode:9000'}
  hermes-qc:
    <<: *agent
    environment: {DEPARTMENT: QC, HERMES_PROFILE: QC, API_BASE_URL: 'http://api:8080', HDFS_NAMENODE: 'hdfs://hdfs-namenode:9000'}
volumes:
  postgres-data: {}
  qdrant-data: {}
  neo4j-data: {}
  hdfs-namenode: {}
  hdfs-datanode-1: {}
  hdfs-datanode-2: {}
  hdfs-datanode-3: {}
  ui-hermes-home: {}
  ui-workspace: {}
