# Phase 13/15 — Docker Model Runner override (shared gemma4:31b for all agents).
#
# This file is NOT applied by a plain `docker compose up` (only the default
# docker-compose.yml + an optional docker-compose.override.yml are auto-loaded).
# It must be passed explicitly with `-f`, so the default stack stays SAFE /
# DRY-RUN, and simply OMITTING this file means the stack uses no model runner.
# Applying it:
#   - points the API's routing at the agents (AGENT_ROUTING_ENABLED=true),
#   - enables real Hermes execution on every agent
#     (HERMES_AGENT_EXECUTION_ENABLED=true), and
#   - wires the SAME shared LLM endpoint + model onto the API and ALL hermes-*
#     agents so every department agent uses the SAME model (gemma4:31b) via one
#     OpenAI-compatible endpoint, while keeping its own department persona/profile
#     (SOUL.md) isolated.
#
#   docker compose -f docker-compose.yml -f docker-compose.model-runner.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.model-runner.yml config
#
# Phase 15+ — the endpoint + model are configured in the repo-controlled,
# non-secret env file `config/model-runner/model-runner.env` (loaded via
# `env_file:` below). The file now contains an indexed candidate list:
#   DOCKER_MODEL_RUNNER_DEFAULT_INDEX=0
#   DOCKER_MODEL_RUNNER_0_BASE_URL=http://host.docker.internal:12434/engines/v1
#   DOCKER_MODEL_RUNNER_1_BASE_URL=http://192.168.100.10:12434/engines/v1
# and matching MODEL / WEBUI_MODEL values. Edit the index to switch runners.
# This compose file only declares provider enablement and host-gateway mapping.
# There is intentionally NO embedded model-runner service: the stack never tries
# to start a model runner of its own; it only CONNECTS to one.
#
# NOTE: a newer Compose additionally supports a top-level `models:` element and a
# per-service `models:` attribute for Docker Model Runner. That is intentionally
# NOT used here so `docker compose config` validates on older Compose too; the
# env-file + env-var wiring below is the portable, version-safe form.

x-model-runner: &model-runner
  # Shared endpoint + model come from the repo-controlled, non-secret env file.
  env_file:
    - ./config/model-runner/model-runner.env
  # Reach the Docker host (and Docker Desktop's Model Runner on TCP 12434) from
  # inside the container network.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  ui-preseed:
    <<: *model-runner
  ui:
    <<: *model-runner
    environment:
      HERMES_INFERENCE_PROVIDER: custom
      OPENAI_API_KEY: no-key-required
  api:
    <<: *model-runner
    environment:
      AGENT_ROUTING_ENABLED: "true"
      HERMES_LLM_PROVIDER: docker-model-runner
  hermes-er:
    <<: *model-runner
    environment:
      HERMES_AGENT_EXECUTION_ENABLED: "true"
      HERMES_AGENT_EXECUTION_BACKEND: direct-openai
      HERMES_AGENT_EXECUTION_TIMEOUT_SECONDS: "180"
      HERMES_LLM_PROVIDER: docker-model-runner
  hermes-it:
    <<: *model-runner
    environment:
      HERMES_AGENT_EXECUTION_ENABLED: "true"
      HERMES_AGENT_EXECUTION_BACKEND: direct-openai
      HERMES_AGENT_EXECUTION_TIMEOUT_SECONDS: "180"
      HERMES_LLM_PROVIDER: docker-model-runner
  hermes-ehs:
    <<: *model-runner
    environment:
      HERMES_AGENT_EXECUTION_ENABLED: "true"
      HERMES_AGENT_EXECUTION_BACKEND: direct-openai
      HERMES_AGENT_EXECUTION_TIMEOUT_SECONDS: "180"
      HERMES_LLM_PROVIDER: docker-model-runner
  hermes-qc:
    <<: *model-runner
    environment:
      HERMES_AGENT_EXECUTION_ENABLED: "true"
      HERMES_AGENT_EXECUTION_BACKEND: direct-openai
      HERMES_AGENT_EXECUTION_TIMEOUT_SECONDS: "180"
      HERMES_LLM_PROVIDER: docker-model-runner
